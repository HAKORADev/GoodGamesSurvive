name: lists-check

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: validate databases + regenerate name-check
        run: python3 tools/lists_check.py

      - name: commit regenerated files (if changed)
        run: |
          git config user.name "ggs-bot"
          git config user.email "ggs-bot@users.noreply.github.com"
          git add work/lists/games/name-check/games-added.txt \
                  work/lists/games/counts.json
          if git diff --cached --quiet; then
            echo "nothing to commit"
          else
            git commit -m "lists-check: regenerate name-check + counts"
            git push
          fi
