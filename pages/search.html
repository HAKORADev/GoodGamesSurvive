<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SEARCH — GOODGAMES SURVIVE</title>
<meta name="description" content="Search the whole catalogue — 692 titles, live, offline, no tracking.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='5' y='5' width='54' height='54' rx='12' fill='%23070707' stroke='%23e8e8e8' stroke-width='4'/%3E%3Ctext x='32' y='45' font-family='monospace' font-size='34' font-weight='bold' fill='%23e8e8e8' text-anchor='middle'%3E?%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=IBM+Plex+Mono:ital,wght@0,400;0,600;1,400&family=Silkscreen:wght@400;700&family=VT323&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/style.css?v=9">
</head>
<body>
<div class="crt" aria-hidden="true">
  <div class="crt-scanlines"></div>
  <div class="crt-vignette"></div>
</div>

<header class="site-head">
  <a class="logo" href="../" aria-label="WA?D — home">
    <span class="logo-diamond" aria-hidden="true">
      <span class="pos pos-t">W</span>
      <span class="pos pos-l">A</span>
      <span class="pos pos-b">?</span>
      <span class="pos pos-r">D</span>
    </span>
    <span class="logo-word">GOODGAMES<em>SURVIVE</em></span>
  </a>
  <nav class="site-nav">
    <a href="../pages/games.html">GAMES <span class="count">(3)</span></a>
    <span class="dead">SOFTWARE <span class="count">(0)</span></span>
    <span class="dead">MODS+PATCHES <span class="count">(0)</span></span>
  </nav>
  <form class="head-search" action="search.html" method="get" role="search">
    <input type="search" name="q" placeholder="search the catalogue" aria-label="search the catalogue">
  </form>
</header>

<main class="page-wrap">

  <section>
    <h2 class="sec-title">SEARCH THE CATALOGUE</h2>
    <input class="search-big" id="q" type="search" placeholder="title, series, year, category..." autocomplete="off" aria-label="search input">
    <p class="search-count" id="count">loading the index...</p>
  </section>

  <div class="dir" id="out"></div>

</main>

<footer class="site-foot">
  <div class="foot-brand">
    <span class="foot-diamond" aria-hidden="true">
      <span class="pos pos-t">W</span>
      <span class="pos pos-l">A</span>
      <span class="pos pos-b">?</span>
      <span class="pos pos-r">D</span>
    </span>
    <span class="foot-line">GOODGAMES SURVIVE</span>
  </div>
  <div class="foot-meta">
    <a href="https://github.com/HAKORADev/GoodGamesSurvive" target="_blank" rel="noopener">GITHUB REPO</a>
    <span>&#169; 2026</span>
  </div>
</footer>

<script>
(function(){
  var OUT = document.getElementById("out");
  var COUNT = document.getElementById("count");
  var Q = document.getElementById("q");
  var rows = [];
  var total = 0;

  function esc(s){
    return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c];
    });
  }
  function thumbPath(th){
    return th.replace(/^(\.\.\/)+/, "../");
  }
  function rowHTML(r){
    var flags = [];
    if (r.l) flags.push(r.l.toUpperCase());
    if (r.b) flags.push("BIG-SIZE");
    for (var i = 0; i < r.w.length; i++) flags.push(r.w[i].toUpperCase());
    var meta = [r.y || "year unknown", r.c || "", r.ser ? "series: " + r.ser : ""]
      .filter(Boolean).join(" · ");
    var thumb = r.th
      ? '<span class="dir-thumb"><img loading="lazy" alt="" src="' + esc(thumbPath(r.th)) + '"></span>'
      : '';
    var inner = thumb
      + '<span class="dir-main"><span class="dir-name">' + esc(r.t) + '</span>'
      + '<span class="dir-meta">' + esc(meta) + '</span>'
      + (flags.length ? '<span class="dir-flags">' + flags.map(esc).join(" · ") + '</span>' : "")
      + '</span>'
      + (r.p ? '<span class="dir-go">OPEN &#8594;</span>'
             : '<span class="dir-go dir-go-dim">IN CATALOGUE</span>');
    return r.p
      ? '<a class="dir-row" href="' + esc(r.p.replace(/^pages\//, "")) + '">' + inner + '</a>'
      : '<div class="dir-row dir-row-plain">' + inner + '</div>';
  }
  function render(){
    var q = Q.value.trim().toLowerCase();
    var hits = [];
    for (var i = 0; i < rows.length; i++){
      var r = rows[i];
      if (!q){
        hits.push(r);
        continue;
      }
      var hay = ((r.t || "") + " " + (r.ser || "") + " " + (r.c || "") + " "
                 + (r.y || "") + " " + (r.l || "")).toLowerCase();
      var ok = true, toks = q.split(/\s+/);
      for (var j = 0; j < toks.length; j++){
        if (hay.indexOf(toks[j]) === -1){ ok = false; break; }
      }
      if (ok) hits.push(r);
    }
    var html = "";
    for (var k = 0; k < hits.length; k++) html += rowHTML(hits[k]);
    OUT.innerHTML = html;
    COUNT.textContent = q
      ? hits.length + " of " + total + " titles"
      : "the whole shelf — " + total + " titles, newest digs on top of their letter";
  }
  fetch("../data/search-index.json?v=9")
    .then(function(r){ return r.json(); })
    .then(function(d){
      rows = d.rows; total = rows.length;
      var pre = new URLSearchParams(location.search).get("q");
      if (pre) Q.value = pre;
      Q.addEventListener("input", render);
      render();
    })
    .catch(function(){
      COUNT.textContent = "index failed to load — refresh once";
    });
})();
</script>

</body>
</html>
