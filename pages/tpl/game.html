<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{TITLE}} — GOODGAMES SURVIVE</title>
<meta name="description" content="{{DESCRIPTION}}">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='5' y='5' width='54' height='54' rx='12' fill='%23070707' stroke='%23e8e8e8' stroke-width='4'/%3E%3Ctext x='32' y='45' font-family='monospace' font-size='34' font-weight='bold' fill='%23e8e8e8' text-anchor='middle'%3E?%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=IBM+Plex+Mono:ital,wght@0,400;0,600;1,400&family=Silkscreen:wght@400;700&family=VT323&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../assets/css/style.css">
</head>
<body data-game="{{SLUG}}">
<div class="crt" aria-hidden="true">
  <div class="crt-scanlines"></div>
  <div class="crt-vignette"></div>
</div>

<header class="page-head">
  <a class="logo" href="../../" aria-label="WA?D — home">
    <span class="logo-diamond" aria-hidden="true" style="width:52px;height:52px">
      <span class="pos pos-t" style="width:15px;height:15px;font-size:8px">W</span>
      <span class="pos pos-l" style="width:15px;height:15px;font-size:8px">A</span>
      <span class="pos pos-b" style="width:15px;height:15px;font-size:8px">?</span>
      <span class="pos pos-r" style="width:15px;height:15px;font-size:8px">D</span>
    </span>
  </a>
  <span class="crumb"><a href="../../">GOODGAMES SURVIVE</a> / <a href="../games.html">GAMES</a> / {{CRUMB}} / <b>{{TITLE}}</b></span>
</header>

<main class="page-wrap">

  <div class="game-top">
    {{COVER_BLOCK}}
    <div class="game-title">
      <h1>{{TITLE}}</h1>
      <p class="game-meta">{{META_LINE}}</p>
      <div class="chips">{{CHIPS}}</div>
    </div>
  </div>

  {{GALLERY_BLOCK}}

  <section>
    <h2 class="sec-title">FACTS</h2>
    <table class="facts">
      {{FACT_ROWS}}
    </table>
  </section>

  {{SERIES_BLOCK}}

  {{DOWNLOADS_BLOCK}}

  <div class="status-box">
    {{TEST_BLOCK}}
  </div>

</main>

<footer class="page-foot">
  <span>GOODGAMES SURVIVE</span>
  <a href="https://github.com/HAKORADev/GoodGamesSurvive">GITHUB REPO</a>
  <span>&#169; 2026</span>
</footer>

{{PAGE_SCRIPT}}
</body>
</html>
